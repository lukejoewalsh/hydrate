name: Update Counter

on:
  repository_dispatch:
    types: [increment]

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Update counter
        run: |
          TEAM=${{ github.event.client_payload.team }}

          node <<EOF
          const fs = require('fs');
          let data = JSON.parse(fs.readFileSync('counter.json'));
          data[process.env.TEAM]++;
          fs.writeFileSync('counter.json', JSON.stringify(data,null,2));
          EOF

      - name: Commit update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add counter.json
          git commit -m "Update counter"
          git push
