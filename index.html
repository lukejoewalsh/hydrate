<!DOCTYPE html>
<html>
<head>
<title>Water Bottle Challenge</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  margin-top:60px;
  background:#eef6ff;
}

h1{
  font-size:42px;
}

.container{
  display:flex;
  justify-content:center;
  gap:80px;
  margin-top:40px;
}

.team{
  background:white;
  padding:30px;
  border-radius:10px;
  width:220px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.count{
  font-size:60px;
  margin:15px;
}

button{
  font-size:18px;
  padding:10px 20px;
  cursor:pointer;
}
</style>

</head>
<body>

<h1>💧 Water Bottle Challenge</h1>

<div class="container">

<div class="team">
<h2>Team A</h2>
<div id="teamA" class="count">0</div>
<button onclick="add('teamA')">+1 Bottle</button>
</div>

<div class="team">
<h2>Team B</h2>
<div id="teamB" class="count">0</div>
<button onclick="add('teamB')">+1 Bottle</button>
</div>

</div>

<script>

const namespace = "water-challenge-2026";

function updateCounts(){
  fetch(`https://api.countapi.xyz/get/${namespace}/teamA`)
  .then(res => res.json())
  .then(data => document.getElementById("teamA").innerText = data.value || 0);

  fetch(`https://api.countapi.xyz/get/${namespace}/teamB`)
  .then(res => res.json())
  .then(data => document.getElementById("teamB").innerText = data.value || 0);
}

function add(team){
  fetch(`https://api.countapi.xyz/hit/${namespace}/${team}`)
  .then(updateCounts);
}

updateCounts();
setInterval(updateCounts, 2000);

</script>

</body>
</html>
