<!DOCTYPE html>
<html>
<head>
<title>Water Bottle Challenge</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 60px;
      background: #eef6ff;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 80px;
    }

    .team {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 220px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .count {
      font-size: 60px;
      margin: 15px;
    }

    .progress-container {
      width: 100%;
      background: #ddd;
      height: 20px;
      border-radius: 10px;
      margin: 10px 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #4caf50;
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    button:active {
      transform: scale(1.1);
      transition: transform 0.1s;
    }

    .flash {
      color: #ff5722;
      transform: scale(1.3);
      transition: transform 0.3s, color 0.3s;
    }
  </style>

</head>

<body>

<h1>💧 Water Bottle Challenge</h1>

<div class="container">

<div class="team">
<h2>O Line</h2>
<div id="teamA" class="count">0</div>
  <div class="progress-container">
    <div id="teamA-bar" class="progress-bar"></div>
  </div>
<button onclick="add('teamA')">+1 Bottle</button>
</div>
  
<div class="team">
<h2>D Line</h2>
<div id="teamB" class="count">0</div>
  <div class="progress-container">
    <div id="teamA-bar" class="progress-bar"></div>
  </div>
<button onclick="add('teamB')">+1 Bottle</button>
</div>

</div>

<script>

const supabaseClient = supabase.createClient(
"https://elifeaqvnllmuogdwtuy.supabase.co",
"sb_publishable_xu0ZdnTuT1Wlyx6iSplpaw_k_a6W0KJ"
);

async function loadCounts() {
  let { data } = await supabaseClient.from("counter").select("*");
  
  let total = data.reduce((sum, row) => sum + row.value, 0) || 1; // avoid division by 0
  
  data.forEach(row => {
    document.getElementById(row.id).innerText = row.value;
    
    // update progress bar
    let bar = document.getElementById(row.id + "-bar");
    if(bar) {
      let percent = (row.value / total) * 100;
      bar.style.width = percent + "%";
    }
  });
}

async function add(team){

let { data } = await supabaseClient
.from("counter")
.select("value")
.eq("id",team)
.single();

await supabaseClient
.from("counter")
.update({ value: data.value + 1 })
.eq("id",team);

loadCounts();
}

loadCounts();

</script>

</body>
</html>
