<!DOCTYPE html>
<html>
<head>
<title>Water Bottle Challenge</title>

<style>
body{
  font-family:Arial;
  text-align:center;
  margin-top:60px;
  background:#eef6ff;
}

.container{
  display:flex;
  justify-content:center;
  gap:80px;
}

.team{
  background:white;
  padding:30px;
  border-radius:10px;
  width:220px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.count{
  font-size:60px;
  margin:15px;
}

button{
  font-size:18px;
  padding:10px 20px;
}
</style>

</head>
<body>

<h1>💧 Water Bottle Challenge</h1>

<div class="container">

<div class="team">
<h2>Team A</h2>
<div id="teamA" class="count">0</div>
<button onclick="add('teamA')">+1 Bottle</button>
</div>

<div class="team">
<h2>Team B</h2>
<div id="teamB" class="count">0</div>
<button onclick="add('teamB')">+1 Bottle</button>
</div>

</div>

<script>

async function loadCounts(){
  const res = await fetch("counter.json");
  const data = await res.json();

  document.getElementById("teamA").innerText = data.teamA;
  document.getElementById("teamB").innerText = data.teamB;
}

async function add(team){

  await fetch(`https://api.github.com/repos/YOUR_USERNAME/YOUR_REPO/dispatches`,{
    method:"POST",
    headers:{
      "Accept":"application/vnd.github+json",
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      event_type:"increment",
      client_payload:{team:team}
    })
  });

  setTimeout(loadCounts,1000);
}

loadCounts();

</script>

</body>
</html>
