<!DOCTYPE html>
<html>
<head>
  <title>Water Bottle Challenge</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body{
      font-family: Arial;
      text-align:center;
      margin-top:50px;
      background:#f0f8ff;
    }

    h1{font-size:40px}

    .team{
      margin:40px;
      padding:20px;
      border-radius:10px;
      background:white;
      display:inline-block;
      width:250px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    button{
      font-size:20px;
      padding:10px 20px;
      margin-top:10px;
      cursor:pointer;
    }

    .count{
      font-size:50px;
      margin:10px;
    }
  </style>
</head>

<body>

<h1>Water Bottle Challenge 💧</h1>

<div class="team">
<h2>Team A</h2>
<div id="teamA" class="count">0</div>
<button onclick="addWater('teamA')">+1 Bottle</button>
</div>

<div class="team">
<h2>Team B</h2>
<div id="teamB" class="count">0</div>
<button onclick="addWater('teamB')">+1 Bottle</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const teamARef = db.ref("teamA");
const teamBRef = db.ref("teamB");

teamARef.on("value", snap=>{
  document.getElementById("teamA").innerText = snap.val() || 0;
});

teamBRef.on("value", snap=>{
  document.getElementById("teamB").innerText = snap.val() || 0;
});

function addWater(team){
  const ref = db.ref(team);

  ref.transaction(current=>{
    return (current || 0) + 1;
  });
}
</script>

</body>
</html>
